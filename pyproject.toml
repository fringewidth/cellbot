[project]
name = "cellbot"
version = "1.0.0"
description = "One language model steers a robot swarm from plain English: every grid cell gets a move, every step."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Hrishik Sai Bojnal", email = "116365046+fringewidth@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "huggingface-hub>=0.30",
    "matplotlib>=3.9",
    "mujoco>=3.2",
    "numpy>=2.0",
    "pillow>=11.0",
    "safetensors>=0.5",
    "scipy>=1.14",
    "torch>=2.6",
    "transformers>=4.56",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
train = ["datasets>=3.0"]

[project.urls]
Weights = "https://huggingface.co/fringewidth/cellbot1"
Demo = "https://huggingface.co/spaces/fringewidth/cellbot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
